{ "branches": ["master", "next"],
  "plugins": [
    [
        "@semantic-release/commit-analyzer",
      {
        "preset": "jshint"
      }
    ],
    [
        "@semantic-release/release-notes-generator",
      {
        "preset": "jshint"
      }
    ],
    # Kept on purpose, even though every run of this configuration is a dry run and
    # the plugin's publish phase therefore never executes: it is this plugin that
    # implements generateNotes, which is what makes the computed notes carry the
    # same enriched text the published release used to carry (commit links with the
    # short sha as link text, "closes #NNN").
    #
    # Everything that used to write is gone from here on purpose -- the version and
    # the CHANGELOG are now written by .github/scripts/release_plan.sh, the commit
    # and the note by release_pr.sh, and the tag and the release by the workflow.
    # Leaving those plugins configured would be configuration that silently does
    # nothing, which is how a rule nobody follows starts.
    "@semantic-release/github"
  ]
}
