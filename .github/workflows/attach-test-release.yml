# Test-branch helper: attach the packages a build run already produced to a release in THIS
# repository.
#
# `release.yml` uploads with a GH_TOKEN secret, which exists on bityuan/bityuan (organisation
# level) but not on a fork, and its `manual_upload` input doubles as both the checkout ref and
# the upload tag -- so it cannot target an existing tag without also checking out that tag's
# code. This workflow does only the upload half: take the artifacts of a run that already
# built, and put them on a release here, with the automatic token.
#
# The artifact file names are already the release names (`bityuan-windows-amd64-qt.exe`,
# `bityuan-linux-amd64.tar.gz`, ...), so the files land on the release unchanged. Not intended
# for master.
name: attach test build to a release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'id of the run whose artifacts to attach'
        required: true
      tag:
        description: 'release tag in this repository'
        required: true

jobs:
  attach:
    name: attach artifacts
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: build/
          pattern: "*"
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Show what was downloaded
        run: ls -la build/

      # Five packages, no more and no fewer: an artifact that silently lost a file would
      # otherwise publish an incomplete release.
      - name: Collect the packages
        run: |
          shopt -s nullglob
          files=(build/bityuan-*.tar.gz build/bityuan-*.zip build/bityuan-*.exe)
          printf '%s\n' "${files[@]}" > files.txt
          echo "found ${#files[@]} packages"
          cat files.txt
          if [ ${#files[@]} -ne 5 ]; then
            echo "expected 5 packages, found ${#files[@]}" >&2
            exit 1
          fi

      - name: Write SHA256SUMS
        run: |
          sha256sum $(cat files.txt) | sed 's#build/##' > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            $(cat files.txt) SHA256SUMS --clobber
