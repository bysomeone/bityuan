# Release note check.
#
# One rule: **a commit that triggers a release has to declare what it means for an
# operator**, in its own body, as a `Release-Note:` line. The release page then shows
# those lines under "Upgrade Notes" -- they are the part of a release page no machine
# can write, because "this changes X, so do Y" is not derivable from a diff.
#
# Which commits trigger a release is *not* decided here: `.github/scripts/release_commit.sh`
# reads it out of `.releaserc.yml`, the file semantic-release itself reads. Change the
# preset there and this check follows -- it cannot drift.
#
# ---------------------------------------------------------------------------------
# How to write one
# ---------------------------------------------------------------------------------
#
#   fix(p2p): raise the peer version floor
#
#   <why the change is needed>
#
#   Release-Note: Nodes older than 6.9.0 are dropped at the p2p layer and blacklisted
#   for 24 hours, so upgrade every node together.
#   Co-authored-by: ...
#
#   - in the commit BODY (not the subject), one line
#   - say what an operator running the previous release has to DO or KNOW -- the
#     consequence, not a restatement of the diff
#   - English: it is published on the release page
#   - `Release-Note: none` when there is genuinely nothing operator-visible. It is an
#     explicit "I checked", not a way to skip the line
#   - one per commit: a pull request with three fixes carries three notes, one bullet each
#   - fix a missing one with `git commit --amend` (or a follow-up commit) and push again
#
# Whether a note is *true* is not a CI question: the second step below only warns, and
# review checks that the note matches the diff.
#
name: release note check

on:
  pull_request:
    branches: [master, next]

permissions:
  contents: read

jobs:
  release-note:
    name: release note
    runs-on: ubuntu-22.04
    steps:
      # Commit bodies, plus the whole pull-request diff
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Every release-triggering commit declares its impact
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=""
          for sha in $(git rev-list "$BASE..$HEAD"); do
            msg=$(git log -1 --format=%B "$sha")
            rc=0
            printf '%s' "$msg" | ./.github/scripts/release_commit.sh || rc=$?
            case "$rc" in
              0) ;;
              # 1 = this commit does not trigger a release, nothing to declare
              1) continue ;;
              # anything else means the classifier itself is out of step with
              # .releaserc.yml -- fail loudly rather than wave commits through
              *)
                echo "::error::release_commit.sh could not classify $sha (exit $rc) -- fix .github/scripts/release_commit.sh" >&2
                exit 1
                ;;
            esac
            if ! printf '%s' "$msg" | grep -qE '^Release-Note:'; then
              missing="$missing ${sha:0:8}"
            fi
          done
          if [ -n "$missing" ]; then
            printf '::error::these commits trigger a release but carry no Release-Note: line:%s\n' "$missing" >&2
            printf '%s\n' \
              "" \
              "Add one line to each commit body (not the subject):" \
              "" \
              "  Release-Note: Nodes older than 6.9.0 are dropped at the p2p layer and blacklisted for 24 hours, so upgrade every node together." \
              "" \
              "  - what an operator on the previous release must DO or KNOW, not a restatement of the diff" \
              "  - English -- it is published on the release page" \
              "  - 'Release-Note: none' if there is genuinely nothing operator-visible" \
              "  - one per commit; three fixes means three notes, one bullet each" \
              "" \
              "Then 'git commit --amend' and push again." >&2
            exit 1
          fi
          echo "every release-triggering commit carries a Release-Note"

      # Advisory, never blocking. A path is a hint, not a verdict: bityuan.toml can be
      # touched without any operator-visible consequence (a comment, a reordering), and
      # a real impact can sit in a file not listed here. So this only makes sure a human
      # reads the note before approving.
      - name: Warning when an operator-visible file changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          touched=""
          for f in bityuan.toml bityuan-fullnode.toml bityuan.go go.mod; do
            # Not `grep -qx "$f" && touched=...`: a non-matching grep returns non-zero,
            # which aborts the step under `set -e` (Actions runs `bash -e`).
            if echo "$changed" | grep -qx "$f"; then
              touched="$touched $f"
            fi
          done
          if [ -z "$touched" ]; then
            echo "no operator-visible file touched"
            exit 0
          fi
          echo "::warning::operator-visible files changed:$touched -- make sure the Release-Note covers what an operator has to do"
          echo "declared / not declared by the commits in this pull request:"
          git log --format=%B "$BASE..$HEAD" | sed -n 's/^Release-Note:[[:space:]]*//p' || true
